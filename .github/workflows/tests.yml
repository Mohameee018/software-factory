name: Tests\n\non:\n  push:\n  pull_request:\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    defaults:\n      run:\n        working-directory: software-factory-language-workers-final\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.11'\n      - run: python -m pip install --upgrade pip\n      - run: pip install -e ".[dev]"\n      - run: python -m compileall factory main.py\n      - run: ruff check factory main.py tests\n      - run: pytest -q\n